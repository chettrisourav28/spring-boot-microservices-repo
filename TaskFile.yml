version: '3'

vars:
  GOOS: "{{OS}}"

  # Maven wrapper command (Windows vs Unix)
  MVN_CMD: '{{if eq .GOOS "windows"}}cmd /c mvnw.cmd{{else}}./mvnw{{end}}'

  DC_DIR: deployment/docker-compose
  INFRA_DC_FILE: "{{.DC_DIR}}/infra.yml"
  APPS_DC_FILE: "{{.DC_DIR}}/apps.yml"

tasks:

  default:
    cmds:
      - task: test

  format:
    cmds:
      - "{{.MVN_CMD}} spotless:apply"

  test:
    deps: [format]
    cmds:
      - "{{.MVN_CMD}} clean verify"

  build:
    cmds:
      - "{{.MVN_CMD}} -pl catalog-service spring-boot:build-image -DskipTests"

  start_infra:
    cmds:
      - docker compose -f "{{.INFRA_DC_FILE}}" up -d

  stop_infra:
    cmds:
      - docker compose -f "{{.INFRA_DC_FILE}}" stop
      - docker compose -f "{{.INFRA_DC_FILE}}" rm -f

  restart_infra:
    cmds:
      - task: stop_infra
      - task: sleep
      - task: start_infra

  start:
    deps: [build]
    cmds:
      - docker compose -f "{{.INFRA_DC_FILE}}" -f "{{.APPS_DC_FILE}}" up -d

  stop:
    cmds:
      - docker compose -f "{{.INFRA_DC_FILE}}" -f "{{.APPS_DC_FILE}}" stop
      - docker compose -f "{{.INFRA_DC_FILE}}" -f "{{.APPS_DC_FILE}}" rm -f

  restart:
    cmds:
      - task: stop
      - task: sleep
      - task: start

  sleep:
    vars:
      DURATION: "{{default 5 .DURATION}}"
    cmds:
      - '{{if eq .GOOS "windows"}}timeout /t {{.DURATION}} > nul{{else}}sleep {{.DURATION}}{{end}}'
